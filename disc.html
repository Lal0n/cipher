<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>מחולל דיסקית הצפנה אינטראקטיבי</title>
    <style>
        body { 
            text-align: center; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #f9f9f9;
        }
        .circle-container { 
            margin: 20px auto; 
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            display: inline-block;
        }
        .controls {
            margin: 20px auto;
            padding: 15px;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            display: inline-block;
        }
        .controls input {
            font-size: 16px;
            padding: 5px;
            width: 70px;
            text-align: center;
            margin-left: 10px;
        }
        .btn {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
        .btn:hover { background-color: #45a049; }
        
        @media print {
            body { background-color: white; margin: 0; }
            .circle-container { box-shadow: none; margin: 0; padding: 0; }
            .no-print { display: none; } /* מסתיר את כפתורי הבקרה בהדפסה */
        }
    </style>
</head>
<body>
    <div class="no-print">
        <h2>תבנית מעגל לדיסקית הצפנה</h2>
        <div class="controls">
            <label for="sectorsInput">מספר גזרות:</label>
            <input type="number" id="sectorsInput" value="24" min="2" max="100">
            <button class="btn" onclick="updateDisc()">🔄 עדכון מעגל</button>
            <button class="btn" onclick="window.print()">🖨️ הדפס תבנית</button>
        </div>
        <p>הדפיסו את העמוד על גבי בריסטול. תוכלו לגזור את העיגול הפנימי המקווקו כדי ליצור שתי דיסקיות (גדולה וקטנה) מאותו הדף.</p>
    </div>
    
    <div class="circle-container">
        <!-- ה-SVG מוגדר לגודל של כ-18 ס"מ -->
        <svg width="18cm" height="18cm" viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
            
            <!-- מעגל חיצוני -->
            <circle cx="500" cy="500" r="480" stroke="black" stroke-width="4" fill="none" />
            
            <!-- מעגל פנימי מקווקו לעזרה בגזירה וכתיבה -->
            <circle cx="500" cy="500" r="380" stroke="#888" stroke-width="2" fill="none" stroke-dasharray="10,10" />
            
            <!-- מעגל מרכזי ריק לחיתוך לסיכה מתפצלת -->
            <circle cx="500" cy="500" r="15" stroke="black" stroke-width="3" fill="none" />

            <!-- קבוצה ריקה שתתמלא בקווים בעזרת קוד ה-JavaScript -->
            <g id="linesGroup"></g>
            
        </svg>
    </div>

    <script>
        function updateDisc() {
            const numSectors = document.getElementById('sectorsInput').value;
            const linesGroup = document.getElementById('linesGroup');
            
            // מחיקת הקווים הישנים לפני ציור מחדש
            linesGroup.innerHTML = '';
            
            // חישוב אוטומטי של הזווית הנדרשת לפי מספר הגזרות
            const angle = 360 / numSectors;

            for(let i = 0; i < numSectors; i++) {
                const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
                line.setAttribute("x1", "500");
                line.setAttribute("y1", "500");
                line.setAttribute("x2", "500");
                line.setAttribute("y2", "20");
                line.setAttribute("stroke", "black");
                line.setAttribute("stroke-width", "2");
                line.setAttribute("transform", `rotate(${i * angle}, 500, 500)`);
                linesGroup.appendChild(line);
            }
        }

        // קריאה לפונקציה מיד עם טעינת העמוד כדי לצייר את הגרסה הראשונית (24 גזרות)
        updateDisc();
    </script>
</body>
</html>
